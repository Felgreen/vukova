services:
  vukova:
    build:
      context: .
      dockerfile: Dockerfile
      # Public env vars needed at build time (baked into JS bundles by Next.js)
      args:
        - NEXT_PUBLIC_MP_PUBLIC_KEY=${NEXT_PUBLIC_MP_PUBLIC_KEY}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    container_name: vukova-app
    # Bind to localhost only — nginx proxies to this port
    ports:
      - "127.0.0.1:3000:3000"
    # Runtime environment variables (server-side only, not baked into image)
    environment:
      - NODE_ENV=production
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN}
      - NEXT_PUBLIC_MP_PUBLIC_KEY=${NEXT_PUBLIC_MP_PUBLIC_KEY}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    # Restart automatically on crash or server reboot
    # unless-stopped: restarts always EXCEPT when manually stopped with docker stop
    restart: unless-stopped
    # Health check — Docker will restart the container if this fails 3 times
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

